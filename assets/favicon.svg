<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13293D" />
      <stop offset="60%" stop-color="#006494" />
      <stop offset="100%" stop-color="#247BA0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B98E0" />
      <stop offset="100%" stop-color="#E8F1F2" />
    </linearGradient>
  </defs>

  <!-- Hexágono de Ciência de Dados -->
  <polygon
    points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5"
    fill="url(#bgGrad)"
    stroke="#1B98E0"
    stroke-width="2.5"
  />

  <!-- Linhas de Rede Neural / Dados sutis ao fundo -->
  <g stroke="#247BA0" stroke-width="1.2" opacity="0.55">
    <line x1="16" y1="18" x2="32" y2="11" />
    <line x1="32" y1="11" x2="48" y2="18" />
    <line x1="16" y1="46" x2="32" y2="53" />
    <line x1="32" y1="53" x2="48" y2="46" />
  </g>

  <!-- Nós de Dados (Data Nodes) nos vértices internos -->
  <circle cx="32" cy="11" r="2.5" fill="#1B98E0" />
  <circle cx="48" cy="18" r="2" fill="#E8F1F2" />
  <circle cx="16" cy="18" r="2" fill="#1B98E0" />
  <circle cx="32" cy="53" r="2.5" fill="#1B98E0" />

  <!-- Monograma PV estilizado -->
  <text
    x="32"
    y="39"
    font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="800"
    fill="#E8F1F2"
    text-anchor="middle"
    letter-spacing="-0.5"
  >PV</text>

  <!-- Barra luminosa inferior de gráfico/dados -->
  <rect x="20" y="44" width="24" height="2.5" rx="1.25" fill="url(#accentGrad)" />
</svg>
